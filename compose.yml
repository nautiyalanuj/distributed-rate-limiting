services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 20
  quota-service:
    build:
      context: .
      target: quota-service
    environment:
      REDIS_HOST: redis
      QUOTA_ADMIN_TOKEN: ${QUOTA_ADMIN_TOKEN:?Copy .env.example to .env}
      QUOTA_SERVICE_TOKEN: ${QUOTA_SERVICE_TOKEN:?Copy .env.example to .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redis:
        condition: service_healthy
  demo-1:
    build:
      context: .
      target: demo-service
    environment:
      PORT: 8081
      QUOTA_URL: http://quota-service:8080
      QUOTA_SERVICE_TOKEN: ${QUOTA_SERVICE_TOKEN:?Copy .env.example to .env}
      INSTANCE_ID: demo-1
      QUOTA_TIMEOUT_MILLIS: ${QUOTA_TIMEOUT_MILLIS:-500}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - quota-service
  demo-2:
    build:
      context: .
      target: demo-service
    environment:
      PORT: 8081
      QUOTA_URL: http://quota-service:8080
      QUOTA_SERVICE_TOKEN: ${QUOTA_SERVICE_TOKEN:?Copy .env.example to .env}
      INSTANCE_ID: demo-2
      QUOTA_TIMEOUT_MILLIS: ${QUOTA_TIMEOUT_MILLIS:-500}
    ports:
      - "127.0.0.1:8082:8081"
    depends_on:
      - quota-service
volumes:
  redis-data:
